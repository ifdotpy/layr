name: ci

on:
  push:
    branches: [main, feat/apfs-complete]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs zstd git python3 docker-registry skopeo apache2-utils bubblewrap
          # t30-oci also uses helm, which the runner image has.
          command -v helm
      # t36-aws-profile uses MinIO. Its project stopped publishing binaries and images, so CI
      # builds a pinned release from source once and keeps it in the cache.
      - name: Cache MinIO
        id: minio
        uses: actions/cache@v4
        with:
          path: ~/minio
          key: minio-RELEASE.2025-10-15T17-29-55Z-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/setup-go@v5
        if: steps.minio.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Build MinIO
        if: steps.minio.outputs.cache-hit != 'true'
        run: |
          CGO_ENABLED=0 GOBIN="$HOME/minio" go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
      - name: Build
        run: cargo build --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Integration tests (root, btrfs on loop files)
        run: |
          sudo modprobe btrfs || true
          # Automatic checks run in bubblewrap as the caller; Ubuntu 24.04 blocks the user
          # namespaces that it needs for users without privileges.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo -E env "PATH=$PATH" LAYR="$PWD/target/debug/layr" LAYR_MINIO_BIN="$HOME/minio/minio" tests/run.sh
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install coreutils gnu-sed zstd
      - name: Create the APFS test volume
        run: |
          hdiutil create -size 4g -fs 'Case-sensitive APFS' -volname LayrCI -type SPARSE -o "$RUNNER_TEMP/layr.sparseimage"
          hdiutil attach "$RUNNER_TEMP/layr.sparseimage" -nobrowse
          sudo diskutil enableOwnership /Volumes/LayrCI
      - name: Build and test APFS
        env:
          LAYR_APFS_TEST_ROOT: /Volumes/LayrCI
        run: |
          exec > >(tee "$RUNNER_TEMP/apfs-tests.log") 2>&1
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          cargo build --locked
          cargo test --locked -- --include-ignored
          export LAYR="$PWD/target/debug/layr"
          python3 tests/apfs-index.py --binary "$LAYR" --root "$LAYR_APFS_TEST_ROOT"
          python3 tests/apfs-thin.py --binary "$LAYR" --root "$LAYR_APFS_TEST_ROOT"
          python3 tests/apfs-status-cache.py --binary "$LAYR" --root "$LAYR_APFS_TEST_ROOT"
          mkdir -p "$RUNNER_TEMP/case" && python3 tests/apfs-case.py --binary "$LAYR" --root "$RUNNER_TEMP/case"
          bash tests/apfs-local.sh
          bash tests/apfs-cache-retention.sh
          bash tests/apfs-lock-hold.sh
          bash tests/run.sh t50-upstream-fixes t51-git-init-space t52-git-init-metadata t53-store-version t55-machine-identity t63-git-import-tree
          LAYR_TEST_DIRECT_MAIN=1 bash tests/run.sh t01-basic t02-merge t03-git t05-transfer t06-sync t08-gitcompat t62-merge-git t68-line-base t69-work-mtime t70-du t71-gc-pushed t72-gc-dedup
          # The default macOS volume ignores case: run the core commands on such a store too.
          hdiutil create -size 2g -fs APFS -volname LayrCase -type SPARSE -o "$RUNNER_TEMP/case.sparseimage"
          hdiutil attach "$RUNNER_TEMP/case.sparseimage" -nobrowse
          LAYR_APFS_TEST_ROOT=/Volumes/LayrCase LAYR_TEST_DIRECT_MAIN=1 bash tests/run.sh t01-basic t02-merge t03-git
          LAYR_APFS_TEST_ROOT=/Volumes/LayrCase python3 tests/apfs-thin.py --binary "$LAYR" --root /Volumes/LayrCase
          sudo env LAYR="$LAYR" LAYR_APFS_TEST_ROOT="$LAYR_APFS_TEST_ROOT" LAYR_APFS_TEST_USER="$(whoami)" bash tests/apfs-service.sh
      - name: Report APFS test failures
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/apfs-tests.log" ]; then
            python3 -c 'import os,pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"],"apfs-tests.log").read_text(); print("::error::"+s[-3500:].replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
      - name: Detach the test volume
        if: always()
        run: hdiutil detach /Volumes/LayrCI || true
