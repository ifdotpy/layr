name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs zstd git python3
      - name: Build
        run: cargo build --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Integration tests (root, btrfs on loop files)
        run: |
          sudo modprobe btrfs || true
          sudo -E env "PATH=$PATH" LAYR="$PWD/target/debug/layr" tests/run.sh
