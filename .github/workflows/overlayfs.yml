name: overlayfs

on:
  push:
    branches: [main, feat/overlayfs-backend]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        filesystem: [ext4, xfs]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs e2fsprogs btrfs-progs zstd git python3 attr
      - name: Create the test filesystem
        env:
          TEST_FILESYSTEM: ${{ matrix.filesystem }}
        run: |
          truncate -s 8G "$RUNNER_TEMP/overlayfs.img"
          if [ "$TEST_FILESYSTEM" = ext4 ]; then
            mkfs.ext4 -q -F "$RUNNER_TEMP/overlayfs.img"
          else
            mkfs.xfs -q -f "$RUNNER_TEMP/overlayfs.img"
          fi
          mkdir "/var/tmp/layr-overlayfs-ci"
          sudo mount -o loop "$RUNNER_TEMP/overlayfs.img" "/var/tmp/layr-overlayfs-ci"
          sudo mount --make-private "/var/tmp/layr-overlayfs-ci"
      - name: Build the OverlayFS binary and tests
        run: |
          cargo build --locked --features overlayfs
          cp target/debug/layr "$RUNNER_TEMP/layr-overlayfs"
          cargo test --locked --features overlayfs --no-run --message-format=json > "$RUNNER_TEMP/unit.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, pathlib
          for line in pathlib.Path(os.environ['RUNNER_TEMP'], 'unit.json').read_text().splitlines():
              item = json.loads(line)
              if item.get('executable') and item.get('profile', {}).get('test'):
                  print('UNIT_TESTS=' + item['executable'])
          PY
      - name: Test snapshots, service, permissions and transfer
        run: |
          export LAYR_OVERLAYFS_TEST_ROOT="/var/tmp/layr-overlayfs-ci"
          export LAYR="$RUNNER_TEMP/layr-overlayfs"
          # Unit tests make stores below the temporary folder; /tmp is on a shared mount.
          sudo env LAYR_OVERLAYFS_TEST_ROOT="$LAYR_OVERLAYFS_TEST_ROOT" TMPDIR="$LAYR_OVERLAYFS_TEST_ROOT" "$UNIT_TESTS" --include-ignored
          sudo env LAYR_OVERLAYFS_TEST_ROOT="$LAYR_OVERLAYFS_TEST_ROOT" LAYR="$LAYR" bash tests/overlayfs-local.sh
          sudo env LAYR_OVERLAYFS_TEST_ROOT="$LAYR_OVERLAYFS_TEST_ROOT" LAYR="$LAYR" bash tests/overlayfs-caches.sh
          sudo env LAYR_OVERLAYFS_TEST_ROOT="$LAYR_OVERLAYFS_TEST_ROOT" LAYR="$LAYR" bash tests/save-unsettled.sh
          if [ "${{ matrix.filesystem }}" = ext4 ]; then
            # A store in a folder that ignores case (ext4 casefold) is refused with a clear message.
            truncate -s 64M "$RUNNER_TEMP/fold.img" && mkfs.ext4 -q -F -O casefold "$RUNNER_TEMP/fold.img"
            sudo mkdir /var/tmp/layr-fold && sudo mount -o loop "$RUNNER_TEMP/fold.img" /var/tmp/layr-fold
            sudo mount --make-private /var/tmp/layr-fold
            sudo mkdir /var/tmp/layr-fold/f /var/tmp/layr-fold-src && sudo chattr +F /var/tmp/layr-fold/f
            echo x | sudo tee /var/tmp/layr-fold-src/a >/dev/null
            ! sudo env LAYR_ROOT=/var/tmp/layr-fold/f/store LAYR_AUTHOR_NAME=T LAYR_AUTHOR_EMAIL=t@x.invalid \
              "$LAYR" init p --from /var/tmp/layr-fold-src -q 2> "$RUNNER_TEMP/fold.err"
            grep "ignores case" "$RUNNER_TEMP/fold.err"
            sudo umount /var/tmp/layr-fold
          fi
