[package]
name = "layr-cache"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Language adapters that prune layr cache folders to the live set"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
layr-adapter = { path = "../layr-adapter" }
rustix = { version = "1", features = ["fs", "process"] }
serde_json = "1"
toml = "0.8"

