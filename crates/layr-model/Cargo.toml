[package]
name = "layr-model"
version = "0.1.0"
edition = "2021"
description = "Pure project read model for signed Layr records"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
hex = "0.4"
similar = "2"

[dev-dependencies]
layr-store = { path = "../layr-store" }
toml = "0.8"
ed25519-dalek = "2"
