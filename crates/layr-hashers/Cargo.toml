[package]
name = "layr-hashers"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[dependencies]
sha1 = "0.11"
sha2 = "0.11"
blake3 = "1"
rapidhash = "4.5"
rustc-hash = "2"

[dev-dependencies]
foldhash = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "maps"
harness = false
