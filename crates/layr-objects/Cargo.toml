[lints]
workspace = true

[package]
name = "layr-objects"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Content-addressed object store of layr: Merkle trees, blobs, deltas and chunks (experimental)"
license = "MIT"
publish = false

[dependencies]
layr-fs-core = { path = "../fs/core" }
layr-object-format = { path = "../store/object-format" }
layr-zstd-frame = { path = "../store/zstd-frame", default-features = false, features = ["native"] }
anyhow = "1"
hmac = "0.12"
layr-hashers = { path = "../layr-hashers", default-features = false, features = ["sha256"] }
rayon = "1"
rustix = { version = "1", features = ["fs", "process"] }
zstd-safe = { version = "7", features = ["std"] }

[dev-dependencies]
hex = "0.4"

[[example]]
name = "objects-bench"
path = "examples/bench.rs"

[[example]]
name = "objects-read"
path = "examples/read.rs"
