[lints]
workspace = true

[package]
name = "layr-store"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Encrypted Layr store format, keys, and transport"
license = "MIT"
publish = false

[features]
default = ["native"]
native = [
  "dep:chrono",
  "dep:rand",
  "dep:reqwest",
  "dep:layr-zstd-frame",
  "layr-zstd-frame/native",
  "ed25519-dalek/rand_core",
  "uuid/v7",
]
wasm = ["dep:getrandom", "dep:layr-zstd-frame", "layr-zstd-frame/wasm"]

[dependencies]
layr-object-format = { path = "../store/object-format" }
layr-zstd-frame = { path = "../store/zstd-frame", default-features = false, optional = true }
anyhow = "1"
age = { version = "0.11", features = ["ssh"] }
bech32 = "0.11"
bip39 = "2"
ssh-key = { version = "0.6", features = ["ed25519"] }
getrandom = { version = "0.2", features = ["js"], optional = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"], optional = true }
layr-hashers = { path = "../layr-hashers", default-features = false, features = ["git"] }
uuid = "1"

[[example]]
name = "release_store_probe"
required-features = ["native"]
