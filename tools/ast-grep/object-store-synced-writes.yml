id: object-store-synced-writes
language: Rust
severity: error
message: >-
  A store file reaches its name only synced (`Store::write_temp`), and a loose object is present only
  when `check_loose` reads it: an unsynced write or a name check let a crash leave empty objects (#452).
files:
  - crates/layr-objects/src/store.rs
  - crates/layr-objects/src/store/**/*.rs
rule:
  any:
    - pattern: fs::write($$$)
    - pattern: self.object_path($ID).exists()
  not:
    inside:
      kind: mod_item
      regex: '^mod tests'
      stopBy: end
