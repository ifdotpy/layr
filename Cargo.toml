[workspace]
members = ["crates/layr-store", "crates/layr-model", "crates/layr-retest", "crates/layr-cache", "crates/layr-adapter", "crates/layr-hashers"]
resolver = "2"

[workspace.package]
rust-version = "1.99.1"

[workspace.metadata.layr-retest]
# The standard commands of the project: the debug builds that the lines and CI run, and the release build that
# main makes for installs. A profile folder is swept only when a command lists it: without the release command,
# target/release would keep its old variants forever. While the release units are stale (the source changed and
# no install build ran), only target/release is skipped. The overlayfs check (CI, Linux) is not listed: a line on
# macOS never builds it, and its stale units would skip the debug folder too.
sweep = [["build", "--locked"], ["build", "--release", "--locked"], ["test", "--locked", "--no-run"]]
env = { CARGO_INCREMENTAL = "1", RUSTC_WRAPPER = "" }

[package]
name = "layr"
version = "0.37.0"
edition = "2021"
rust-version.workspace = true
description = "Local version control on btrfs, APFS and OverlayFS"
license = "MIT"
publish = false

[[bin]]
name = "layr"
path = "src/main.rs"

[features]
overlayfs = []

[dependencies]
layr-store = { path = "crates/layr-store" }
layr-model = { path = "crates/layr-model" }
layr-retest = { path = "crates/layr-retest" }
layr-adapter = { path = "crates/layr-adapter" }
layr-cache = { path = "crates/layr-cache" }
anyhow = "1"
age = { version = "0.11", features = ["ssh"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hmac = "0.12"
ignore = "0.4"
libc = "0.2"
rand = "0.8"
rayon = "1"
regex = "1"
rustix = { version = "1", features = ["fs", "net", "process", "thread", "event", "stdio", "pipe", "termios"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_yaml = "0.9"
layr-hashers = { path = "crates/layr-hashers" }
similar = "2"
tar = "0.4"
toml = "0.8"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }
zerocopy = { version = "0.8.63", features = ["derive"] }

[profile.release]
debug = 1

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
