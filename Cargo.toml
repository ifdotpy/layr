[workspace]
# vendor/fuser: fuser 0.18.0 with a poll-before-sleep patch (docs/layrfs-fuse.md).
exclude = ["vendor"]
members = [
  "crates/core/types",
  "crates/fs/stream-codec",
  "crates/fs/core",
  "crates/fs/common",
  "crates/fs/plain",
  "crates/fs/unix",
  "crates/store/object-format",
  "crates/layr-api",
  "crates/layr-store",
  "crates/layr-model",
  "crates/layr-matching",
  "crates/layr-retest",
  "crates/layr-cache",
  "crates/layr-adapter",
  "crates/layr-hashers",
  "crates/layr-objects",
]
resolver = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
manual_let_else = "warn"
undocumented_unsafe_blocks = "deny"

# Lower numbers may not depend on higher numbers. Leaf packages also reject heavy dependencies.
[workspace.metadata.layers]
layr-adapter = { layer = 0, dependencies = [], leaf = true }
layr-api = { layer = 0, dependencies = [], leaf = true }
layr-fs-unix = { layer = 1, dependencies = ["layr-fs-core"], leaf = true, normal-dependencies = ["layr-fs-core", "rustix"] }
layr-fs-common = { layer = 1, dependencies = ["layr-fs-core"], leaf = true, normal-dependencies = ["layr-fs-core"] }
layr-fs-plain = { layer = 2, dependencies = ["layr-fs-core", "layr-fs-common", "layr-fs-unix"] }
layr-fs-core = { layer = 0, dependencies = [], leaf = true, normal-dependencies = ["serde"] }
layr-stream-codec = { layer = 0, dependencies = [], leaf = true }
layr-types = { layer = 0, dependencies = [], leaf = true }
layr-hashers = { layer = 0, dependencies = [], leaf = true }
layr-object-format = { layer = 1, dependencies = [
  "layr-hashers",
  "layr-types",
], leaf = true, normal-dependencies = [
  "layr-types",
  "layr-hashers",
  "hmac",
] }
layr-store = { layer = 1, dependencies = ["layr-hashers", "layr-object-format"] }
layr-cache = { layer = 1, dependencies = ["layr-adapter"] }
layr-model = { layer = 2, dependencies = ["layr-hashers", "layr-store", "layr-types"] }
layr-matching = { layer = 0, dependencies = [], leaf = true, normal-dependencies = [] }
layr-objects = { layer = 2, dependencies = ["layr-fs-core", "layr-hashers", "layr-object-format", "layr-store"] }
layr-retest = { layer = 2, dependencies = ["layr-cache"] }
layr = { layer = 3, dependencies = [
  "layr-adapter",
  "layr-api",
  "layr-cache",
  "layr-hashers",
  "layr-model",
  "layr-matching",
  "layr-objects",
  "layr-retest",
  "layr-store",
  "layr-types",
  "layr-stream-codec",
  "layr-fs-core",
  "layr-fs-common",
  "layr-fs-plain",
  "layr-fs-unix",
] }

[workspace.package]
# The version of layr and layr-api (layr-api reports the version of the binary): `layr release prepare` sets it.
version = "0.51.7"
rust-version = "1.100.0"

[workspace.metadata.layr-retest]
# The standard commands of the project: the debug builds that the lines and CI run, and the release build that
# main makes for installs. A profile folder is swept only when a command lists it: without the release command,
# target/release would keep its old variants forever. While the release units are stale (the source changed and
# no install build ran), only target/release is skipped. The overlayfs check (CI, Linux) is not listed: a line on
# macOS never builds it, and its stale units would skip the debug folder too.
sweep = [["build", "--locked"], ["build", "--release", "--locked"], ["test", "--locked", "--no-run"]]
env = { CARGO_INCREMENTAL = "1", RUSTC_WRAPPER = "" }

[lints]
workspace = true

[package]
name = "layr"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Local version control on btrfs, APFS and OverlayFS"
license = "MIT"
publish = false

[[bin]]
name = "layr"
path = "src/main.rs"

[features]
# Fast lines on Linux (LayrFS over FUSE, docs/layrfs-lab.md) are in every build. The fuser crate
# is a Linux dependency only, so macOS builds do not change.
default = ["layrfs-fuse"]
overlayfs = []
# The FUSE view of a line on Linux, served by layr daemon.
layrfs-fuse = ["dep:fuser"]

[dependencies]
layr-fs-unix = { path = "crates/fs/unix" }
layr-fs-common = { path = "crates/fs/common" }
layr-fs-core = { path = "crates/fs/core", features = ["serde"] }
layr-stream-codec = { path = "crates/fs/stream-codec" }
layr-types = { path = "crates/core/types" }
layr-api = { path = "crates/layr-api" }
layr-store = { path = "crates/layr-store" }
layr-model = { path = "crates/layr-model" }
layr-matching = { path = "crates/layr-matching" }
layr-retest = { path = "crates/layr-retest" }
layr-adapter = { path = "crates/layr-adapter" }
layr-cache = { path = "crates/layr-cache" }
layr-objects = { path = "crates/layr-objects" }
anyhow = "1"
age = { version = "0.11", features = ["ssh"] }
base64 = "0.22"
crc32fast = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
globset = "0.4"
grep-matcher = "0.1"
grep-printer = "0.2"
grep-regex = "0.1"
grep-searcher = "0.1"
hmac = "0.12"
ignore = "0.4"
libc = "0.2"
memchr = "2"
rand = "0.8"
rayon = "1"
regex = "1"
rustix = { version = "1.1.6", features = [
  "fs",
  "net",
  "process",
  "thread",
  "event",
  "stdio",
  "pipe",
  "termios",
  "mount",
] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
serde_yaml = "0.9"
layr-hashers = { path = "crates/layr-hashers" }
similar = "2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = "0.4"
toml = "0.8"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }
zerocopy = { version = "0.8.63", features = ["derive"] }
# The check runner's connection to a Layr Cloud gateway (src/runner.rs).
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
wtransport = { version = "0.7", default-features = false, features = ["ring"] }

[dev-dependencies]
layr-fs-plain = { path = "crates/fs/plain" }
# The runner tests: a self-signed WebTransport server and a client that skips its certificate.
wtransport = { version = "0.7", default-features = false, features = [
  "ring",
  "self-signed",
  "dangerous-configuration",
] }

[profile.release]
debug = 1

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-foundation = "0.10"
security-framework-sys = "2"

[patch.crates-io]
fuser = { path = "vendor/fuser" }
