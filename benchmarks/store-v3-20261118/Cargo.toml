[package]
name = "store-v3-prototype"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
filetime = "0.2"
rayon = "1"
serde_json = "1"
gix = { version = "0.90", default-features = false, features = ["max-performance", "sha1", "pack-cache-lru-static"] }
layr-objects = { path = "../../crates/layr-objects" }

[profile.release]
debug = 1
