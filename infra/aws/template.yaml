AWSTemplateFormatVersion: '2010-09-09'
Description: Layr project store, immutable objects and separate reader, writer and GC roles.
Parameters:
  Prefix:
    Type: String
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,43}'
  GatewayRoleArns:
    Type: CommaDelimitedList
    Description: Exact gateway and executor role ARNs that can assume the project roles.
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteStateUploads
            Status: Enabled
            Prefix: !Sub '${Prefix}/states/'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: RemoveGarbageCollectedStateData
            Status: Enabled
            Prefix: !Sub '${Prefix}/states/'
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpiredObjectDeleteMarker: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  Writer:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'layr-store-writer-${Prefix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Ref GatewayRoleArns
      Policies:
        - PolicyName: store-writer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource:
                  - !Sub '${Bucket.Arn}/${Prefix}/records/*'
                  - !Sub '${Bucket.Arn}/${Prefix}/states/*'
                  - !Sub '${Bucket.Arn}/${Prefix}/slots/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [!Sub '${Prefix}/records/*', !Sub '${Prefix}/states/*']
  Reader:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'layr-store-reader-${Prefix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Ref GatewayRoleArns
      Policies:
        - PolicyName: store-reader
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${Bucket.Arn}/${Prefix}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [!Sub '${Prefix}/', !Sub '${Prefix}/*']
  Gc:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'layr-store-gc-${Prefix}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Ref GatewayRoleArns
      Policies:
        - PolicyName: store-gc
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub '${Bucket.Arn}/${Prefix}/states/*/*.data.age'
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireConditionalCreate
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              'Null':
                s3:if-none-match: 'true'
              Bool:
                s3:ObjectCreationOperation: 'true'
          - Sid: RequireCreateOnlyValue
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringNotEquals:
                s3:if-none-match: '*'
              Bool:
                s3:ObjectCreationOperation: 'true'
          - Sid: RequireTransportEncryption
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  BucketName:
    Value: !Ref Bucket
  StoreUrl:
    Value: !Sub 's3://${Bucket}/${Prefix}'
  WriterRoleArn:
    Value: !GetAtt Writer.Arn
  ReaderRoleArn:
    Value: !GetAtt Reader.Arn
  GcRoleArn:
    Value: !GetAtt Gc.Arn
